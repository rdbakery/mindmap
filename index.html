<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MindCanvas - Visual Knowledge Mapping</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="index.css">

</head>

<body>

<div class="toolbar">
  <div class="toolbar-inner">
    <select id="mapSelector"></select>
    <button onclick="createMap()">➕ New</button>
    <button onclick="renameMap()">✏️ Rename</button>
    <button onclick="deleteMap()">🗑 Delete</button>
    <button onclick="undo()">Undo</button>
    <button onclick="redo()">Redo</button>
    <button onclick="exportJSON()">Export JSON</button>
    <button onclick="exportPNG()">Export PNG</button>
    <button onclick="exportPDF()">Export PDF</button>
    <label class="import-btn">
      📥 Import Mind Map
      <input type="file" accept=".json" onchange="importJSON(event)" hidden>
    </label>
    <button id="toggleAllBtn" class="expand-collapse-btn"
      title="Collapse All" onclick="toggleAllNodes()"></button>
    <input type="search" placeholder="Search node…"
      oninput="searchNodes(this.value)">
      <button onclick="isAdmin ? disableAdminMode() : enableAdminMode()">
  🔐 Admin
</button>
  </div>
</div>


<div id="canvas">
  <svg id="svg"></svg>
</div>
<script src="index.js"></script>
<script src="prevent.js"></script>
</body>
</html>
