<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="mm-gurukul-logo.png" type="image/png">
<title>Mindmap Gurukul - Visual Knowledge Mapping</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="index.css">

</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JLSMJKVWX9"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-JLSMJKVWX9');
</script>

<body>

<div class="toolbar">
  <div class="toolbar-inner">
    <select id="mapSelector"></select>

    <!-- Map management -->
    <button onclick="createMap()">➕ New</button>
    <button onclick="renameMap()">✏️ Rename</button>
    <button onclick="deleteMap()">🗑 Delete</button>
    <label class="import-btn">
      📥 Import Mind Map
      <input type="file" accept=".json" onchange="importJSON(event)" hidden>
    </label>
    <label class="import-btn">
      📦 Import All Maps
      <input type="file" accept=".json" onchange="importAllMaps(event)" hidden>
    </label>

    <!-- Export / Share -->
    <button onclick="exportJSON()">📄 Export JSON</button>
    <button onclick="exportAllMaps()">📦 Export All Maps</button>
    <button onclick="exportPNG()" id="exportPngBtn">🖼 Export PNG</button>
    <button onclick="exportPDF()" id="exportPdfBtn">📕 Export PDF</button>

    <!-- Edit actions -->
    <button onclick="undo()">↶ Undo</button>
    <button onclick="redo()">↷ Redo</button>

    <!-- Search -->
    <div class="search-box">
      <input type="search" placeholder="Search node…" 
        oninput="searchNodes(this.value)" id="searchInput">

      <span id="searchCount">0/0</span>

      <button onclick="prevSearch()">▲</button>
      <button onclick="nextSearch()">▼</button>
      <button onclick="clearSearch()">✖</button>
    </div>

    <!-- View controls -->
    <button id="toggleAllBtn" class="expand-collapse-btn"
      title="Collapse All" onclick="toggleAllNodes()"></button>
    <button onclick="toggleFilterDropdown(event)" id="filterBtn">🔍 Filter</button>

    <!-- Tests -->
    <select id="testSelector" onchange="startSelectedTest(this.value)">
      <option value="">📝 Start Test...</option>
    </select>
    <label class="import-btn">
      📥 Import Test
      <input type="file" accept=".json" onchange="importTestJSON(event)" hidden>
    </label>

    <!-- Quiz & utilities -->
    <button id="quizModeBtn" onclick="toggleQuizMode()">🧠 Quiz Mode</button>
    <button id="revealQuizBtn" onclick="revealAllQuizAnswers()" hidden>Reveal All</button>
    <button id="progressDashboardBtn" onclick="openProgressDashboard()">📊 Progress</button>

    <button onclick="window.open('https://youtu.be/5iraDyHm6WY', '_blank')" title="View User Guide">🎥 User Guide</button>
    <button onclick="isAdmin ? disableAdminMode() : enableAdminMode()">🔐 Admin</button>
  </div>
</div>

<div id="pyqFilterBox" class="filter-dropdown-menu hidden"></div>


<div id="canvas">
  <svg id="svg"></svg>
</div>
<script src="config.js"></script>
<script src="index.js"></script>
<script src="prevent.js"></script>
</body>
</html>
